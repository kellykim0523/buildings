<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sky-elements">
    <div class="cloud cloud--a"></div>
    <div class="cloud cloud--b"></div>
    <div class="cloud cloud--c"></div>
  </div>

  <div class="horizon"></div>
  <div class="ground"></div>

  <div class="scroll-container">
    <div class="track"id="track">

     <div class="building b-empire" style="--h: 50vh;" tabindex="0">
     <img class="building-img" src="assets/image/empire.png" alt="Empire State">
     <div class="info">
     <h2>EMPIRE STATE</h2>
     <p>The King of Manhattan</p>
  </div>
</div>

<div class="building b-chrysler" style="--h: 50vh;" tabindex="0">
   <img class="building-img" src="assets/image/cry.png" alt="Chrysler Building">
   <div class="info">
   <h2>CHRYSLER</h2>
   <p>Art Deco Crown</p>
   </div>
</div>

<div class="building b-oneworld" style="--h: 50vh;" tabindex="0">
   <img class="building-img" src="assets/image/oneworld.png" alt="One World Trade Center">
   <div class="info">
    <h2>ONE WORLD</h2>
    <p>Freedom Tower</p>
  </div>
</div>

  

  <script src="script.js"></script>
</body>
</html>
